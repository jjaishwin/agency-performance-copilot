# Databricks Asset Bundle: the whole project as code. Built for Azure Databricks Premium (see AZURE_BUILD_GUIDE.md);
# notebooks 01-10 also run on Free Edition. Notebook 11 needs Agent Bricks (Premium).
#   databricks bundle validate
#   databricks bundle deploy --var warehouse_id=<id>
#   databricks bundle run copilot_pipeline    # 01 -> 10, fails if the Genie benchmark gate fails
#   databricks bundle run deal_desk           # start the app
bundle:
  name: agency-performance-copilot

variables:
  catalog:
    description: Unity Catalog catalog for bronze, silver and gold
    default: workspace
  warehouse_id:
    description: SQL warehouse used by Genie, the dashboard and the app
  min_pass_rate:
    description: Release gate, minimum share of Genie benchmarks that must pass
    default: "0.9"

resources:
  jobs:
    copilot_pipeline:
      name: agency-performance-copilot-pipeline
      description: Synthetic sources -> bronze -> silver -> gold -> governance -> metric views -> scorecards -> brief agent -> Genie deploy + benchmark gate -> AI/BI dashboard
      max_concurrent_runs: 1
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./notebooks/01_generate_synthetic_data.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: bronze
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingest.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/03_silver_quality.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/04_gold_model.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: governance
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ./notebooks/05_governance.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: metric_views
          depends_on: [{task_key: governance}]
          notebook_task:
            notebook_path: ./notebooks/06_metric_views.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: scorecards
          depends_on: [{task_key: governance}]
          notebook_task:
            notebook_path: ./notebooks/07_scorecards_and_deals.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: brief_agent
          depends_on: [{task_key: scorecards}]
          notebook_task:
            notebook_path: ./notebooks/08_brief_agent_mlflow.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: agent_bricks_prep
          depends_on: [{task_key: scorecards}]
          notebook_task:
            notebook_path: ./notebooks/11_agent_bricks_prep.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: fabric_share
          depends_on: [{task_key: brief_agent}]
          notebook_task:
            notebook_path: ./notebooks/12_fabric_share.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: genie_release_gate
          depends_on: [{task_key: metric_views}, {task_key: scorecards}]
          notebook_task:
            notebook_path: ./notebooks/09_genie_agent_as_code.py
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"
              mode: deploy_and_test
              min_pass_rate: "${var.min_pass_rate}"
        - task_key: monitoring_dashboard
          depends_on: [{task_key: genie_release_gate}]
          run_if: ALL_DONE   # refresh the dashboard even when the gate fails, so the failure is visible
          notebook_task:
            notebook_path: ./notebooks/10_monitoring_dashboard.py
            base_parameters:
              catalog: "${var.catalog}"
              warehouse_id: "${var.warehouse_id}"

  apps:
    deal_desk:
      name: deal-desk
      description: Contract what-if and Ask Genie for account managers
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: "${var.warehouse_id}"
            permission: CAN_USE
      user_api_scopes: [sql, genie]

targets:
  dev:
    mode: development
    default: true
